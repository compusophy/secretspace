[workspace]
resolver = "2"
members = ["crates/engine", "crates/pixels", "crates/kit", "crates/gpu", "crates/render", "crates/showcase-web", "crates/hub-web", "crates/wyrm", "crates/wyrm-look", "crates/wyrm-web", "crates/luciphon", "crates/luciphon-look", "crates/luciphon-web", "crates/wandfall", "crates/wandfall-web", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["compusophy"]
repository = "https://github.com/compusophy/secretspace"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The server: release, but a panicking room unwinds, so the host can catch
# it, rebuild that room from its snapshot and keep every other room up.
[profile.server]
inherits = "release"
panic = "unwind"

# The physics tests run thousands of ticks; keep them fast.
[profile.test]
opt-level = 2
