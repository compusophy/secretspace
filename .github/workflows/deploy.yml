# Every push to main or a claude/ branch: test, build, then ship the game
# server to Railway and the page to Vercel production.
#
# Railway (the server): repository secret RAILWAY_TOKEN (a project token)
# and variable RAILWAY_SERVICE (default "game").
# Vercel (the page): secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID,
# and variable RELAY, the server's WebSocket (wss://<domain>/ws). The page
# is not deployed until RELAY is set: a page with no server is no game.
name: deploy

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Rust with the wasm and musl targets
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --target x86_64-unknown-linux-musl
          rustup default stable

      - name: The wasm-bindgen CLI version Cargo.lock pins
        id: wb
        run: echo "version=$(awk '/name = "wasm-bindgen"/{getline; gsub(/[^0-9.]/,""); print; exit}' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deploy-${{ runner.os }}-${{ steps.wb.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: deploy-${{ runner.os }}-${{ steps.wb.outputs.version }}-

      - name: Install wasm-bindgen CLI
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" != "${{ steps.wb.outputs.version }}" ]; then
            cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked --force
          fi

      - name: Test
        run: cargo test --workspace --quiet

      - name: Build the page and the server
        run: bash scripts/build-web.sh && bash scripts/ship.sh

      - name: Ship the server to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::No RAILWAY_TOKEN secret: the server was not deployed."
            exit 0
          fi
          cd ship
          npx --yes @railway/cli@latest up --ci --service "${SERVICE:-game}"
          echo "### Server shipped to Railway (service ${SERVICE:-game})" >> "$GITHUB_STEP_SUMMARY"

      - name: Point the pages at the server
        id: page
        env:
          RELAY: ${{ vars.RELAY }}
        run: |
          if [ -z "$RELAY" ]; then
            echo "::warning::No RELAY variable (the server's wss://.../ws): the page was not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for page in $(find dist -name index.html); do
            sed -i "s|<meta name=\"server\" content=\"[^\"]*\">|<meta name=\"server\" content=\"$RELAY\">|" "$page"
            grep -q "name=\"server\" content=\"$RELAY\"" "$page"
          done
          cp web/vercel.json dist/
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the pages to Vercel production
        if: steps.page.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Set the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets."
            exit 1
          fi
          url=$(npx --yes vercel@latest deploy dist --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Page deployed to production: $url" >> "$GITHUB_STEP_SUMMARY"
