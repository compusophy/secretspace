[package]
name = "secretspace-web"
description = "The page: one island in this tab, drawn on a canvas, linked to strangers' islands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
space = { package = "secretspace-space", path = "../space" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "HtmlTextAreaElement",
  "HtmlInputElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "TextMetrics",
  "CssStyleDeclaration",
  "DomRect",
  "DomTokenList",
  "Event",
  "EventTarget",
  "MessageEvent",
  "PointerEvent",
  "MouseEvent",
  "KeyboardEvent",
  "BroadcastChannel",
  "Storage",
  "Performance",
  "Location",
  "VisibilityState",
  "Crypto",
]
