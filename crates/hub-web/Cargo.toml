[package]
name = "secretspace-hub"
description = "The front page: every game as a card, who is playing what, and how many have come by. Drawn pixel by pixel in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "hub"
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { package = "secretspace-engine", path = "../engine" }
wyrm = { package = "secretspace-wyrm", path = "../wyrm" }
look = { package = "secretspace-wyrm-look", path = "../wyrm-look" }
luciphon = { package = "secretspace-luciphon", path = "../luciphon" }
lucilook = { package = "secretspace-luciphon-look", path = "../luciphon-look" }
wandfall = { package = "secretspace-wandfall", path = "../wandfall" }
wandfall-look = { package = "secretspace-wandfall-look", path = "../wandfall-look" }
render = { package = "secretspace-render", path = "../render" }
gpu = { package = "secretspace-gpu", path = "../gpu" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
kit = { package = "secretspace-kit", path = "../kit" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["PointerEvent", "MouseEvent", "KeyboardEvent", "WheelEvent"] }
