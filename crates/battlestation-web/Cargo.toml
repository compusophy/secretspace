[package]
name = "secretspace-battlestation-web"
description = "Battlestation's page: a desk at night in first person, drawn by the engine on WebGPU. Your keyboard and mouse move the ones on the desk; the hands type what you type; the monitor runs a terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "battlestation_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
battlestation = { package = "secretspace-battlestation", path = "../battlestation" }
look = { package = "secretspace-battlestation-look", path = "../battlestation-look" }
engine = { package = "secretspace-engine", path = "../engine" }
gpu = { package = "secretspace-gpu", path = "../gpu" }
render = { package = "secretspace-render", path = "../render" }
kit = { package = "secretspace-kit", path = "../kit" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["KeyboardEvent", "WheelEvent", "CssStyleDeclaration", "HtmlCanvasElement", "HtmlElement", "Window", "Document", "CanvasRenderingContext2d", "ImageData"] }

