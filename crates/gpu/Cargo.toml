[package]
name = "secretspace-gpu"
description = "The engine's GPU layer: a WebGPU device on a canvas (wgpu), its capabilities, and a pixel layer composited over the picture. Generic: no game knowledge."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "gpu"

[dependencies]
kit = { package = "secretspace-kit", path = "../kit" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "HtmlCanvasElement", "Navigator", "Window"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
