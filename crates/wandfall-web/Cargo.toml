[package]
name = "secretspace-wandfall-web"
description = "Wandfall's page: a wand battle royale in first person, drawn by the engine on WebGPU, its own wizard predicted to the bit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "wandfall_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
wandfall = { package = "secretspace-wandfall", path = "../wandfall" }
wandfall-look = { package = "secretspace-wandfall-look", path = "../wandfall-look" }
engine = { package = "secretspace-engine", path = "../engine" }
gpu = { package = "secretspace-gpu", path = "../gpu" }
render = { package = "secretspace-render", path = "../render" }
kit = { package = "secretspace-kit", path = "../kit" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
