[package]
name = "secretspace-render"
description = "The engine: a retained 3D scene drawn on WebGPU (meshes, instances, lights in a grid, sky, fog, see-through and glowing passes, sparks, a first-person viewmodel). Generic: no game knowledge."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "render"

[dependencies]
gpu = { package = "secretspace-gpu", path = "../gpu" }
kit = { package = "secretspace-kit", path = "../kit" }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
