[package]
name = "secretspace-luciphon-web"
description = "Luciphon's page, in first person: two hands, WebGL2 driven from Rust, a pixel HUD over it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "luciphon_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
luciphon = { package = "secretspace-luciphon", path = "../luciphon" }
lucilook = { package = "secretspace-luciphon-look", path = "../luciphon-look" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
engine = { package = "secretspace-engine", path = "../engine" }
kit = { package = "secretspace-kit", path = "../kit" }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Element", "HtmlElement", "WebGl2RenderingContext"] }
