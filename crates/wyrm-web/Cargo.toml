[package]
name = "secretspace-wyrm-web"
description = "wyrm's page: drawn pixel by pixel in Rust, steered with a mouse or a finger."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "wyrm_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
wyrm = { package = "secretspace-wyrm", path = "../wyrm" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
look = { package = "secretspace-wyrm-look", path = "../wyrm-look" }
engine = { package = "secretspace-engine", path = "../engine" }
kit = { package = "secretspace-kit", path = "../kit" }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["PointerEvent", "MouseEvent", "KeyboardEvent"] }
