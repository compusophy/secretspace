[package]
name = "secretspace-showcase-web"
description = "The engine's showcase: what the GPU layer draws, on WebGPU, or WebGL2 where there is none. A test page for the renderer, not a game."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "showcase_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
gpu = { package = "secretspace-gpu", path = "../gpu" }
kit = { package = "secretspace-kit", path = "../kit" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["WebGl2RenderingContext"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
