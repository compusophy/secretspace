[package]
name = "secretspace-arena-web"
description = "The arena's page: drawn pixel by pixel in Rust, steered with a mouse or a finger."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "arena_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
arena = { package = "secretspace-arena", path = "../arena" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
kit = { package = "secretspace-kit", path = "../kit" }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["PointerEvent", "MouseEvent", "KeyboardEvent"] }
