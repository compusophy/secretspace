[package]
name = "secretspace-kit"
description = "The browser end every page shares: a pixel screen, input, sockets, storage. Rust only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kit"

[dependencies]
engine = { package = "secretspace-engine", path = "../engine" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "ImageData",
  "Event",
  "EventTarget",
  "MessageEvent",
  "PointerEvent",
  "MouseEvent",
  "KeyboardEvent",
  "Storage",
  "Performance",
  "Location",
  "Navigator",
  "MediaQueryList",
  "WebSocket",
  "BinaryType",
  "CloseEvent",
  "Crypto",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "HtmlAnchorElement",
  "XmlHttpRequest",
]
