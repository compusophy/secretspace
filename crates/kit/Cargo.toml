[package]
name = "secretspace-kit"
description = "The browser end every page shares: a pixel screen (or WebGL2 with a pixel layer), input, sockets, storage. Rust only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kit"

[dependencies]
engine = { package = "secretspace-engine", path = "../engine" }
pixels = { package = "secretspace-pixels", path = "../pixels" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "console",
  "HtmlIFrameElement",
  "History",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "ImageData",
  "Event",
  "EventTarget",
  "MessageEvent",
  "PointerEvent",
  "MouseEvent",
  "WheelEvent",
  "AddEventListenerOptions",
  "KeyboardEvent",
  "Storage",
  "Performance",
  "Location",
  "Navigator",
  "MediaQueryList",
  "VisualViewport",
  "WebSocket",
  "BinaryType",
  "CloseEvent",
  "Crypto",
  "XmlHttpRequest",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "AudioContext",
  "AudioContextState",
  "BaseAudioContext",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioScheduledSourceNode",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "GainNode",
  "StereoPannerNode",
]
